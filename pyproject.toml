[project]
name = "sharedai"
version = "0.1.0"
description = "Neutral shared contracts and helpers for ai-local services"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44",
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2",
  "pydantic-settings>=2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "BLE", "E4", "E7", "E9", "F", "I", "RUF", "S", "UP"]
ignore = ["S101", "S105", "S106", "S108"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B008"]
